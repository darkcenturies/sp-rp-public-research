name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_public.py
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public ASIs
        shell: powershell
        run: ./client/sprp-blips/build.ps1 -Release
      - name: Build Crashfix
        shell: powershell
        run: ./client/valkyrie-crashfix/source/build.ps1
      - name: Crashfix native tests
        shell: powershell
        run: ./client/valkyrie-crashfix/source/tests/build-tests.ps1
      - name: Repair build and isolated self-tests
        shell: powershell
        run: ./client/valkyrie-repair/source/build.ps1
