name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_public.py
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public mods and Repair self-tests
        shell: powershell
        run: ./build.ps1 -Release
      - name: Crashfix native tests
        shell: powershell
        run: ./client/valkyrie-asi-suite/valkyrie-crashfix/src/tests/build-tests.ps1
